services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnflow
      POSTGRES_PASSWORD: learnflow
      POSTGRES_DB: learnflow
    ports:
      - "5432:5432"
    volumes:
      - learnflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnflow -d learnflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnflow_pgdata:
